name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/stoic-lamport-l25xgy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Pages has to be switched on once by hand: Settings -> Pages -> Build and
      # deployment -> Source: GitHub Actions. The workflow token cannot create the
      # site itself (that needs admin scope), so `enablement: true` here just fails
      # with a more confusing error. Once it is on, this step and the deploy work.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
