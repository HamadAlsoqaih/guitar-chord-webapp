name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Pages has to be switched on once by hand: Settings -> Pages -> Build and
      # deployment -> Source: GitHub Actions. The workflow token cannot create the
      # site itself (that needs admin scope), so `enablement: true` here just fails
      # with a more confusing error. Once it is on, this step and the deploy work.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # No `environment: github-pages` block on purpose.
    #
    # That block hands the job to GitHub's environment protection rules, and this
    # repo's github-pages environment was created while a different branch was the
    # default — so its deployment branch policy still names that branch and rejects
    # main outright: "Branch main is not allowed to deploy to github-pages due to
    # environment protection rules", one second in, before any step runs.
    #
    # deploy-pages authenticates with the OIDC token and posts the artifact to the
    # Pages API directly; the environment block only governs the deployment record
    # and the protection gate. Dropping it deploys from main without needing the
    # environment's stale policy edited by hand.
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
